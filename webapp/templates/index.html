<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>题库</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}">
  <!-- 公式渲染：题目里的 $...$ / $$...$$ 交给 KaTeX；CDN 拿不到就原样显示 LaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
  <main>
    <header>
      <div class="header-row">
        <div>
          <h1>题库</h1>
        </div>
      </div>
    </header>

    <section id="view-browse" class="view">
      <div class="browse-layout">
        <aside class="panel browse-sidebar">
          <div class="field">
            <label for="browse-subject">科目</label>
            <select id="browse-subject" disabled></select>
          </div>
          <div class="field" id="browse-school-block" hidden>
            <label for="browse-school">学校</label>
            <select id="browse-school" disabled></select>
          </div>
          <div class="field" id="browse-faculty-block" hidden>
            <label for="browse-faculty">学院</label>
            <select id="browse-faculty" disabled></select>
          </div>
          <div class="field" id="browse-major-block" hidden>
            <label for="browse-major">专攻</label>
            <select id="browse-major" disabled></select>
          </div>
          <div class="field" id="browse-question-block" hidden>
            <label for="browse-question">题目</label>
            <select id="browse-question" disabled></select>
          </div>
        </aside>

        <div class="browse-main">
          <div class="panel browse-controls">
            <div class="browse-summary">
              <span id="browse-scope" class="tag"></span>
              <span id="browse-count"></span>
              <button type="button" id="reopen-similar" class="link" hidden>查看上次相似题</button>
            </div>
          </div>

          <p id="browse-empty" class="empty" hidden></p>
          <ol id="browse-list" class="browse-list"></ol>
        </div>
      </div>
    </section>

    <aside id="similar-drawer" class="similar-drawer" hidden aria-label="相似题目">
      <div class="similar-drawer-head">
        <div>
          <h2>相似题目</h2>
          <p id="similar-scope" class="drawer-meta"></p>
        </div>
        <button type="button" id="close-similar" class="drawer-close" aria-label="关闭">×</button>
      </div>
      <p id="similar-status" class="drawer-status" hidden></p>
      <label class="drawer-threshold">返回题目数
        <input id="similar-count" type="number" min="1" max="50" step="1" value="5">
        <button type="button" id="rerun-similar" class="jump-button">重新检索</button>
      </label>
      <ol id="similar-results" class="similar-results"></ol>
    </aside>
    <div id="similar-backdrop" class="similar-backdrop" hidden></div>
  </main>

  {% if feedback_enabled %}
  <button type="button" id="feedback-fab" class="feedback-fab" aria-label="填写反馈问卷">
    <span aria-hidden="true">📝</span>
    <span>反馈</span>
  </button>

  <div id="feedback-modal" class="feedback-modal" hidden role="dialog" aria-modal="true" aria-labelledby="feedback-title">
    <div class="feedback-modal-backdrop" data-feedback-close></div>
    <div class="feedback-modal-panel" role="document">
      <button type="button" class="feedback-modal-close" data-feedback-close aria-label="关闭">×</button>
      <h2 id="feedback-title">帮我做得更好 ✨</h2>
      <p class="feedback-modal-sub">3 个问题，30 秒搞定。</p>

      <form id="feedback-form" class="feedback-form" novalidate>
        <input type="text" name="hp" class="feedback-hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <label class="feedback-field">
          <span>1. 改进建议（自由发挥）</span>
          <textarea name="suggestion" rows="3" maxlength="2000" required placeholder="检索更准 / 加更多题 / 解析详细 / 界面更好用…想到啥写啥"></textarea>
        </label>

        <fieldset class="feedback-fieldset">
          <legend>2. 后续会持续追加题目和科目，做成包月网站后，你每月愿意花多少？</legend>
          <label class="feedback-radio"><input type="radio" name="willingness" value="不愿付费" required>完全不愿付费</label>
          <label class="feedback-radio"><input type="radio" name="willingness" value="1-5元">1-5 元（咖啡钱）</label>
          <label class="feedback-radio"><input type="radio" name="willingness" value="5-15元">5-15 元</label>
          <label class="feedback-radio"><input type="radio" name="willingness" value="15-30元">15-30 元</label>
          <label class="feedback-radio"><input type="radio" name="willingness" value="30+元">30+ 元</label>
          <label class="feedback-radio"><input type="radio" name="willingness" value="其他">其他（请说明）</label>
          <label class="feedback-field feedback-other" id="feedback-other-block" hidden>
            <textarea name="willingness_other" id="feedback-other-input" rows="2" maxlength="500" placeholder="说一下你的想法，比如愿意付多少、什么条件下愿意…"></textarea>
          </label>
        </fieldset>

        <fieldset class="feedback-fieldset">
          <legend>3. 你现在在哪？</legend>
          <label class="feedback-radio"><input type="radio" name="role" value="备考" required>备考</label>
          <label class="feedback-radio"><input type="radio" name="role" value="工作">工作</label>
          <label class="feedback-radio"><input type="radio" name="role" value="其他">其他</label>
        </fieldset>

        <div class="feedback-actions">
          <button type="button" data-feedback-close class="feedback-btn feedback-btn-ghost">取消</button>
          <button type="submit" id="feedback-submit" class="feedback-btn feedback-btn-primary">提交反馈</button>
        </div>
        <p id="feedback-status" class="feedback-status" hidden></p>
      </form>
    </div>
  </div>
  {% endif %}

  <script id="example-json" type="application/json">{{ example | safe }}</script>
  <script id="scope-tree" type="application/json">{{ scope_tree | tojson }}</script>
  <script id="default-subject" type="application/json">{{ default_subject | tojson }}</script>
  <script defer src="{{ url_for('static', filename='app.js') }}?v={{ asset_version }}"></script>
</body>
</html>
