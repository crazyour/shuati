<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>题库</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>题库</h1>
      <p class="sub">按科目、学校、学院、专攻和题目浏览。</p>
    </header>
    <section class="layout">
      <aside class="panel filters">
        <label>科目<select id="subject"></select></label>
        <label id="school-wrap" hidden>学校<select id="school"></select></label>
        <label id="faculty-wrap" hidden>学院<select id="faculty"></select></label>
        <label id="major-wrap" hidden>专攻<select id="major"></select></label>
        <label id="question-wrap" hidden>题目<select id="question"></select></label>
      </aside>
      <section>
        <div class="panel summary"><span id="scope"></span><span id="count"></span><button id="reopen" type="button" hidden>查看上次相似题</button></div>
        <p id="empty" class="empty" hidden></p>
        <ol id="questions" class="questions"></ol>
      </section>
    </section>
  </main>
  <aside id="drawer" class="drawer" hidden>
    <button id="close" class="close" type="button">×</button>
    <h2>相似题目</h2>
    <p id="similar-status" class="muted"></p>
    <label class="threshold">返回题目数
      <input id="result-count" type="number" min="1" max="50" step="1" value="5">
      <button id="rerun" type="button">重新检索</button>
    </label>
    <ol id="similar" class="similar"></ol>
  </aside>
  <div id="backdrop" class="backdrop" hidden></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
